name: Build and deploy to GitHub Pages

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual re-deploy from the Actions tab

# Cancel any in-progress deployment when a new push arrives
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# contents: write  — needed to push package-lock.json on first run
#                    and to push the built site to the gh-pages branch
permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# Job
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use GITHUB_TOKEN with write permission so the lock-file commit step
          # can push back to main without a separate PAT.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm cache — only active once package-lock.json has been committed.
      # Skipped silently on the very first run (file doesn't exist yet).
      - name: Restore npm cache
        uses: actions/cache@v4
        if: hashFiles('bundle/package-lock.json') != ''
        with:
          path: ~/.npm
          key: npm-bundle-${{ hashFiles('bundle/package-lock.json') }}
          restore-keys: npm-bundle-

      # ── 3. Install dependencies ─────────────────────────────────────────────
      # First run:  package-lock.json doesn't exist → npm install generates it,
      #             workflow commits it back with [skip ci] so this run finishes,
      #             the NEXT push uses npm ci for reproducible installs.
      # All later runs: package-lock.json exists → npm ci (fast, reproducible).
      - name: Install bundle dependencies
        working-directory: bundle
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci"
            npm ci
          else
            echo "No package-lock.json — running npm install and committing lock file"
            npm install
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(bundle): add package-lock.json [skip ci]"
            git push
            echo "Lock file committed — subsequent runs will use npm ci"
          fi

      # ── 4. Build Vite bundle ────────────────────────────────────────────────
      # Outputs:  bundle/dist/bundle.js
      #           bundle/dist/bundle.js.map   (sourcemap for dev builds)
      - name: Build Vite bundle
        working-directory: bundle
        run: npm run build

      # ── 5. Stage deployment files ───────────────────────────────────────────
      # _site/ receives only what GitHub Pages needs to serve:
      #   • all root-level .html / .js / .css files (credentials hardcoded in config.js)
      #   • bundle/dist/bundle.js  (the Vite output — nothing else from bundle/)
      #   • .nojekyll              (stops Jekyll processing paths like bundle/dist/)
      #
      # Intentionally excluded from _site/:
      #   bundle/node_modules/   bundle/src/   bundle/vite.config.js
      #   bundle/package*.json   bundle/.eslintrc.cjs   bundle/.prettierrc
      - name: Stage deployment files
        run: |
          mkdir -p _site/bundle/dist

          # Prevent Jekyll from processing the site (required for paths under bundle/)
          touch _site/.nojekyll

          # Copy all root-level web assets generically — new files are picked up
          # automatically without editing this step.
          find . -maxdepth 1 -type f \
            \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.ico" \) \
            -exec cp {} _site/ \;

          # Copy ONLY the built bundle output — not the full bundle/ directory
          cp bundle/dist/bundle.js _site/bundle/dist/bundle.js

          # Print the manifest so it's visible in the Actions log
          echo ""
          echo "── Deployment manifest ──────────────────────"
          find _site -type f | sort
          echo "─────────────────────────────────────────────"

      # ── 6. Deploy to GitHub Pages ───────────────────────────────────────────
      # Pushes _site/ to the gh-pages branch.
      # force_orphan: true keeps that branch as a single flat commit —
      # no deployment history bloating the branch over time.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
