<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0c0e">
  <title>Construction Cam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Landing page specific — uses variables from style.css */
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    /* ── Grid noise texture ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(245,158,11,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,158,11,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glow ── */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245,158,11,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 0;
    }

    .tag {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.1s;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(64px, 12vw, 120px);
      line-height: 0.9;
      letter-spacing: 0.04em;
      text-align: center;
      color: var(--text);
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    h1 span { color: var(--accent); }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 32px auto;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.35s;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-align: center;
      max-width: 320px;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.4s;
    }

    .cards {
      display: flex;
      gap: 16px;
      margin-top: 48px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.55s;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: 200px;
      padding: 24px;
      background: var(--accent-alpha);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 3px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(245,158,11,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      background: rgba(245,158,11,0.16);
      transform: translateY(-2px);
    }

    .card:hover::before { opacity: 1; }

    .card-icon  { font-size: 22px; line-height: 1; }

    .card-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; }

    .card-arrow {
      position: absolute;
      bottom: 20px; right: 20px;
      font-size: 16px;
      color: var(--accent);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }

    .card:hover .card-arrow { opacity: 1; transform: translateX(0); }

    .footer {
      position: fixed;
      bottom: 24px; left: 0; right: 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.7s;
    }

    .corner { position: fixed; width: 16px; height: 16px; }
    .corner--tl { top: 20px; left: 20px;    border-top: 1px solid var(--accent); border-left:  1px solid var(--accent); }
    .corner--tr { top: 20px; right: 20px;   border-top: 1px solid var(--accent); border-right: 1px solid var(--accent); }
    .corner--bl { bottom: 20px; left: 20px;  border-bottom: 1px solid var(--accent); border-left:  1px solid var(--accent); }
    .corner--br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--accent); border-right: 1px solid var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .cards { flex-direction: column; align-items: center; }
      .card  { width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <main class="page">
    <div class="tag">WebRTC · Live Streaming · MVP</div>

    <h1>Construction<br><span>Cam</span></h1>

    <div class="divider"></div>

    <p class="subtitle">Live camera streaming from site to desktop. Android sender · VPS relay · Browser viewer.</p>

    <div class="cards">
      <a class="card" href="sender.html">
        <div class="card-icon">📷</div>
        <div class="card-label">Mobile</div>
        <div class="card-title">Sender</div>
        <div class="card-desc">Open on Android Chrome to stream the rear camera.</div>
        <div class="card-arrow">→</div>
      </a>

      <a class="card" href="viewer.html">
        <div class="card-icon">🖥</div>
        <div class="card-label">Desktop</div>
        <div class="card-title">Viewer</div>
        <div class="card-desc">Open on desktop to watch the live camera feed.</div>
        <div class="card-arrow">→</div>
      </a>
    </div>
  </main>

  <footer class="footer">CONSTRUCTION CAM · MVP · <span id="year"></span></footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
