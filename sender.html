<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DIGIARCH 424 — Sender</title>
  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Variables ──────────────────────────────────────────────────────── */
    :root {
      --bg:           #090c12;
      --bg-glass:     rgba(9, 12, 18, 0.82);
      --accent:       #39e83e;
      --accent-dim:   rgba(57, 232, 62, 0.35);
      --amber:        #f5a623;
      --red:          #f87171;
      --text:         #dce4f5;
      --muted:        #7a90b8;
      --border:       rgba(57, 232, 62, 0.25);
      --mono:         'JetBrains Mono', 'Cascadia Code', monospace;
      --sans:         -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius:       8px;
    }

    /* ── Base ────────────────────────────────────────────────────────────── */
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    /* ── Camera container ────────────────────────────────────────────────── */
    #sender-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    #top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(9,12,18,0.75) 0%, transparent 100%);
      z-index: 20;
      pointer-events: none;
    }

    .brand-badge {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--accent);
      background: rgba(9,12,18,0.70);
      border: 0.5px solid var(--accent-dim);
      border-radius: 5px;
      padding: 4px 10px;
    }

    #connection-status {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: rgba(9,12,18,0.70);
      border: 0.5px solid rgba(122,144,184,0.30);
      border-radius: 5px;
      padding: 4px 10px;
      pointer-events: none;
    }

    #connection-status.connected  { color: var(--accent); border-color: var(--accent-dim); }
    #connection-status.connecting { color: var(--amber);  border-color: rgba(245,166,35,.35); }
    #connection-status.error      { color: var(--red);    border-color: rgba(248,113,113,.35); }

    /* ── Bottom control bar ──────────────────────────────────────────────── */
    #control-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(9,12,18,0.80) 0%, transparent 100%);
      z-index: 20;
    }

    .btn {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      padding: 10px 22px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      letter-spacing: .02em;
      outline: none;
    }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .38; cursor: not-allowed; pointer-events: none; }

    .btn-primary {
      background: var(--accent);
      color: #090c12;
    }
    .btn-danger {
      background: var(--red);
      color: #1a0505;
    }
    .btn-secondary {
      background: rgba(57, 232, 62, 0.12);
      color: var(--accent);
      border: 0.5px solid var(--accent-dim);
    }

    /* ── VPS status pill ─────────────────────────────────────────────────── */
    #vps-status-bar {
      display: none;             /* shown by JS once checkVPSSupport resolves */
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: rgba(9,12,18,0.75);
      border: 0.5px solid rgba(122,144,184,.30);
      border-radius: 5px;
      padding: 5px 10px;
    }
    #vps-status-bar.active { color: var(--accent); border-color: var(--accent-dim); }
    #vps-status-bar.warn   { color: var(--amber);  border-color: rgba(245,166,35,.35); }

    /* ── Idle overlay (shown before camera starts) ───────────────────────── */
    #idle-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg);
      z-index: 10;
    }
    #idle-overlay .idle-logo  { font-size: 36px; }
    #idle-overlay .idle-title {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .06em;
    }
    #idle-overlay .idle-sub {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<!-- ── Camera / sender viewport ─────────────────────────────────────────── -->
<div id="sender-container">

  <!-- Idle state — hidden once camera starts -->
  <div id="idle-overlay">
    <div class="idle-logo">📷</div>
    <div class="idle-title">DIGIARCH 424</div>
    <div class="idle-sub">Tap Start Camera to begin</div>
  </div>

  <!-- Camera feed -->
  <video id="localVideo" autoplay muted playsinline></video>

  <!-- Top bar: brand + connection status -->
  <div id="top-bar">
    <div class="brand-badge">◈ DIGIARCH 424 · SENDER</div>
    <div id="connection-status">Not connected</div>
  </div>

  <!-- Bottom controls -->
  <div id="control-bar">

    <!-- Start / Stop camera -->
    <button id="start-btn" class="btn btn-primary">Start Camera</button>
    <button id="stop-btn"  class="btn btn-danger"  disabled>Stop</button>

    <!-- Phase 1 T4: Start AR (WebXR VPS) — visibility managed by JS -->
    <button id="start-ar-btn" class="btn btn-secondary" style="display:none">
      Start AR
    </button>

    <!-- Phase 1 T4: VPS status -->
    <div id="vps-status-bar">
      <span id="vps-status-text">VPS —</span>
    </div>

  </div>

</div><!-- /sender-container -->


<!-- ════════════════════════════════════════════════════════════════════════ -->
<!-- Scripts — ORDER IS CRITICAL                                            -->
<!-- bundle.js MUST load first so window.* globals are available           -->
<!-- ════════════════════════════════════════════════════════════════════════ -->

<!-- Phase 1 T2: Vite bundle — exposes ArucoDetector, OrientationTracker,  -->
<!--             createVPSProvider, checkVPSSupport on window.*             -->
<script src="bundle/dist/bundle.js"></script>

<!-- Phase 0: jsQR — QR code detection library (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<!-- Phase 0: project config / utils / settings -->
<script src="config.js"></script>
<script src="utils.js"></script>
<script src="settings.js"></script>

<!-- Phase 0 + Phase 1: location, markers -->
<script src="location.js"></script>
<script src="markers.js"></script>

<!-- ════════════════════════════════════════════════════════════════════════ -->
<!-- Phase 0: WebRTC Module A — PeerConnection + ICE + TURN setup          -->
<!-- Replace this comment block with your existing WebRTC module scripts.   -->
<!-- Example:                                                               -->
<!--   <script src="webrtc-connection.js"></script>                         -->
<!--   <script src="webrtc-signaling.js"></script>                          -->
<!--   <script src="webrtc-sender.js"></script>                             -->
<!-- ════════════════════════════════════════════════════════════════════════ -->


<!-- ════════════════════════════════════════════════════════════════════════ -->
<!-- Application wiring                                                    -->
<!-- ════════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  // ── Element refs ─────────────────────────────────────────────────────────
  const localVideo    = document.getElementById('localVideo');
  const idleOverlay   = document.getElementById('idle-overlay');
  const startBtn      = document.getElementById('start-btn');
  const stopBtn       = document.getElementById('stop-btn');
  const startArBtn    = document.getElementById('start-ar-btn');
  const vpsStatusBar  = document.getElementById('vps-status-bar');
  const vpsStatusText = document.getElementById('vps-status-text');
  const connStatus    = document.getElementById('connection-status');

  // ── sendDataChannel ───────────────────────────────────────────────────────
  // Defined here as a no-op; overridden by WebRTC data channel setup below
  // once the peer data channel opens. location.js and markers.js both call
  // this global — do not rename it.
  window.sendDataChannel = function (_payload) {
    // Replaced by WebRTC data channel setup — see Phase 0 module code
  };

  // ── Camera capture ────────────────────────────────────────────────────────

  let _stream = null;

  async function startCapture() {
    try {
      _stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode:  { ideal: 'environment' }, // rear camera preferred
          width:       { ideal: 1280 },
          height:      { ideal: 720 },
        },
        audio: false,
      });
    } catch (err) {
      console.error('[sender] getUserMedia failed:', err);
      setStatus('Camera error: ' + err.message, 'error');
      return;
    }

    localVideo.srcObject = _stream;
    idleOverlay.style.display = 'none';

    startBtn.disabled = true;
    stopBtn.disabled  = false;

    // Phase 0: start WebRTC peer connection
    // ── Replace this comment with your Phase 0 WebRTC startPeerConnection()
    //    call. Pass _stream to addTrack or the RTCPeerConnection as needed. ──

    // Phase 1 T1 + T4: start location tracking (GPS + compass + orientation)
    // Must be called here, inside the button-click user gesture, so that
    // DeviceOrientationEvent.requestPermission() (iOS 13+) succeeds.
    await window.locationTracker.start().catch(err =>
      console.warn('[sender] locationTracker.start() error:', err)
    );

    // Phase 1 T1: start marker detection
    localVideo.addEventListener('loadedmetadata', () => {
      window.markerDetector.start(localVideo);
    }, { once: true });

    // Phase 1 T4: check VPS support and show/hide Start AR button
    _checkVPSCapability();

    setStatus('Connecting…', 'connecting');
  }

  function stopCapture() {
    // Phase 1 T1+T4: stop all sensors
    window.locationTracker.stop();
    window.markerDetector.stop();

    // Phase 0: close WebRTC peer connection
    // ── Replace this comment with your Phase 0 closeConnection() call. ──

    // Stop camera tracks
    if (_stream) {
      _stream.getTracks().forEach(t => t.stop());
      _stream = null;
    }
    localVideo.srcObject = null;
    idleOverlay.style.display = '';

    startBtn.disabled = false;
    stopBtn.disabled  = true;

    // Hide AR button and VPS status
    startArBtn.style.display    = 'none';
    vpsStatusBar.style.display  = 'none';
    vpsStatusBar.className      = '';

    setStatus('Not connected');
  }

  // ── Phase 1 T4: VPS capability check + AR button ─────────────────────────

  async function _checkVPSCapability() {
    if (typeof window.checkVPSSupport !== 'function') return;

    const cap = await window.checkVPSSupport();
    if (cap.supported) {
      startArBtn.style.display   = '';
      vpsStatusBar.style.display = 'flex';
      vpsStatusText.textContent  = 'VPS — tap to start';
    } else {
      vpsStatusBar.style.display = 'flex';
      vpsStatusBar.classList.add('warn');
      vpsStatusText.textContent  = 'VPS — ' + (cap.reason ?? 'not supported');
    }
  }

  startArBtn.addEventListener('click', async () => {
    startArBtn.disabled = true;
    vpsStatusText.textContent = 'VPS — starting…';

    try {
      // _initVPS() triggers navigator.xr.requestSession() — must be called
      // directly from a user gesture (this click handler satisfies that).
      await window.locationTracker._initVPS();

      vpsStatusBar.classList.add('active');
      vpsStatusText.textContent = 'VPS — active';
      startArBtn.style.display  = 'none';
    } catch (err) {
      console.error('[sender] VPS start failed:', err);
      vpsStatusBar.classList.add('warn');
      vpsStatusText.textContent  = 'VPS — failed';
      startArBtn.disabled        = false;
    }
  });

  // ── Connection status helper ──────────────────────────────────────────────

  /**
   * Update the top-bar connection indicator.
   * @param {string} text
   * @param {'connected'|'connecting'|'error'|''} [state]
   */
  function setStatus(text, state = '') {
    connStatus.textContent = text;
    connStatus.className   = state;
  }

  // Expose for Phase 0 WebRTC code to call when peer state changes
  window.setConnectionStatus = setStatus;

  // ── Button wiring ─────────────────────────────────────────────────────────
  startBtn.addEventListener('click', startCapture);
  stopBtn.addEventListener ('click', stopCapture);

  // ── Page lifecycle ────────────────────────────────────────────────────────
  window.addEventListener('beforeunload', stopCapture);

}());
</script>

</body>
</html>
