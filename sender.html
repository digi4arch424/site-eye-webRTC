<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0a0c0e">
  <title>Construction Cam — Sender</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #localVideo { object-fit: contain !important; background: #000; }

    .settings-panel {
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .settings-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; cursor: pointer; user-select: none;
      border-bottom: 1px solid transparent; transition: border-color 0.2s;
    }
    .settings-header:hover { background: rgba(245,158,11,0.04); }
    .settings-panel.open .settings-header { border-bottom-color: var(--border); }
    .settings-toggle { color: var(--accent); font-size: 11px; width: 14px; }
    .settings-title {
      font-family: var(--sans); font-size: 12px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted);
    }
    .settings-body { display: none; padding: 14px; gap: 10px; flex-direction: column; }
    .settings-panel.open .settings-body { display: flex; }
    .settings-row { display: flex; flex-direction: column; gap: 4px; }
    .settings-label {
      font-family: var(--mono); font-size: 10px;
      color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase;
    }
    .settings-input {
      background: var(--bg); border: 1px solid var(--border-hi);
      border-radius: var(--radius); padding: 7px 10px;
      font-family: var(--mono); font-size: 12px; color: var(--text);
      outline: none; transition: border-color 0.15s;
    }
    .settings-input:focus { border-color: var(--accent); }
    .settings-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn-danger { border-color: #ef4444; color: #ef4444; }
    .btn-danger:hover:not(:disabled) { background: #ef4444; color: #fff; border-color: #ef4444; }
    .btn-secondary {
      padding: 8px 16px;
      border-radius: 6px;
      background: var(--color-bg-secondary, #333);
      color: var(--color-text-primary, #fff);
      border: 1px solid var(--color-border, #555);
      cursor: pointer;
      font-size: 14px;
    }
    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-label {
      color: var(--color-text-secondary, #aaa);
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="header">
      <svg class="header-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 6.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0zM12 1a5.5 5.5 0 1 0 0 11A5.5 5.5 0 0 0 12 1zm0 14c-4.5 0-8 2-8 4v1h16v-1c0-2-3.5-4-8-4z"/>
      </svg>
      <span class="header-title">Construction Cam</span>
      <span class="header-sub">SENDER</span>
      <a href="index.html" class="home-link">← Home</a>
    </header>

    <main class="main">

      <div class="status-bar">
        <span id="status" class="status status--info">Initialising…</span>
        <span class="status-indicator"></span>
      </div>

      <div class="video-panel">
        <div class="video-label">LOCAL PREVIEW</div>
        <div class="corner-mark corner-mark--tl"></div>
        <div class="corner-mark corner-mark--tr"></div>
        <div class="corner-mark corner-mark--bl"></div>
        <div class="corner-mark corner-mark--br"></div>
        <div class="video-wrap">
          <div class="video-placeholder" id="placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
              <path d="M15 6.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0zM12 1a5.5 5.5 0 1 0 0 11A5.5 5.5 0 0 0 12 1zm0 14c-4.5 0-8 2-8 4v1h16v-1c0-2-3.5-4-8-4z"/>
            </svg>
            Camera not started
          </div>
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="startBtn">▶ Start Stream</button>
            <button id="start-ar-btn"
            class="btn-secondary"
            style="display:none"
            aria-label="Start AR spatial tracking">
              Start AR
            </button>
            <span id="vps-status"
                  class="status-label"
                  style="display:none; font-size:12px; margin-left:8px;">
              VPS: —
            </span>
        <button class="btn btn-danger" id="stopBtn" style="display:none">■ Stop Stream</button>
      </div>

      <div class="settings-panel" id="settingsPanel">
        <div class="settings-header" id="settingsHeader">
          <span class="settings-toggle" id="settingsToggle">▶</span>
          <span class="settings-title">Settings</span>
        </div>
        <div class="settings-body">
          <div class="settings-row">
            <label class="settings-label">Session ID</label>
            <input class="settings-input" id="peerIdInput" type="text" placeholder="site-cam-001" />
          </div>
          <div class="settings-row">
            <label class="settings-label">Site ID</label>
            <input class="settings-input" id="siteIdInput" type="text" placeholder="site-alpha" />
          </div>
          <div class="settings-actions">
            <button class="btn" id="applySettingsBtn">Apply & Reconnect</button>
          </div>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Session ID</div>
          <div class="info-value" id="peerIdDisplay">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Resolution</div>
          <div class="info-value">1280 × 720</div>
        </div>
        <div class="info-item">
          <div class="info-label">Frame Rate</div>
          <div class="info-value">15 fps</div>
        </div>
        <div class="info-item">
          <div class="info-label">Site ID</div>
          <div class="info-value" id="siteIdDisplay">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Network Mode</div>
          <div class="info-value" id="network-mode-indicator">—</div>
        </div>
      </div>

    </main>
  </div>

  <!-- Load order: config → utils → modules → debug → page logic → settings -->
  <!-- Phase 1: Vite bundle — must load before location.js and markers.js -->
  <script src="dist/bundle.js"></script>
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="https://digi4arch424.github.io/webrtc-network-modules/module-b.js"></script>
  <script src="https://digi4arch424.github.io/webrtc-network-modules/module-c.js"></script>
  <script src="https://digi4arch424.github.io/webrtc-network-modules/module-a.js"></script>
  <script src="https://digi4arch424.github.io/webrtc-network-modules/signaling.js"></script>
  <script src="app.js"></script>
  <script src="https://digi4arch424.github.io/vendor-js/jsqr.min.js"></script>
  <script src="debug.js"></script>
  <script src="diagnostics.js"></script>
  <script src="location.js"></script>
  <script src="markers.js"></script>
  <script src="sender.js"></script>
  <script src="settings.js"></script>
  <script>
  // Phase 1 Track 4: AR button wiring
  // Runs after DOMContentLoaded — bundle.js is already parsed by this point.
  document.addEventListener('DOMContentLoaded', async () => {

    const arBtn    = document.getElementById('start-ar-btn');
    const vpsLabel = document.getElementById('vps-status');

    // Check WebXR capability and show button only if supported
    if (window.checkVPSSupport) {
      const cap = await window.checkVPSSupport();
      if (cap.supported) {
        arBtn.style.display = '';
        vpsLabel.style.display = '';
      } else {
        console.warn('[sender.html] VPS not supported:', cap.reason);
        vpsLabel.style.display = '';
        vpsLabel.textContent = 'VPS: unsupported on this device';
      }
    }

    // Clicking "Start AR" initialises the VPS provider via LocationTracker
    // LocationTracker exposes _initVPS() as a public method after the
    // location.js patch is applied. Replace 'locationTracker' with whatever
    // your location.js module's exported/global instance is named.
    arBtn.addEventListener('click', async () => {
      arBtn.disabled = true;
      vpsLabel.textContent = 'VPS: Starting…';
      try {
        // 'locationTracker' = the instance variable used in your location.js
        // Common alternatives: window.locationModule, window.loc, _locationTracker
        await locationTracker._initVPS();
        vpsLabel.textContent = 'VPS: Active';
        arBtn.style.display = 'none';
      } catch (err) {
        console.error('[sender.html] VPS start failed:', err);
        vpsLabel.textContent = 'VPS: Failed — ' + err.message;
        arBtn.disabled = false;
      }
    });

  });
  </script>
</body>
</html>
