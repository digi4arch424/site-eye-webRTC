<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0c0e">
  <title>Construction Cam — Viewer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .fullscreen-btn {
      position: absolute; bottom: 10px; right: 10px; z-index: 10;
      background: rgba(0,0,0,0.6); border: 1px solid var(--border-hi);
      color: var(--text); font-size: 14px; padding: 6px 10px;
      border-radius: 3px; cursor: pointer; font-family: var(--mono);
      opacity: 0; transition: opacity 0.2s;
    }
    .video-wrap:hover .fullscreen-btn { opacity: 1; }

    .live-badge {
      display: none; position: absolute; top: 10px; right: 10px; z-index: 4;
      background: var(--red); color: #fff; font-family: var(--mono);
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      padding: 3px 8px; border-radius: 2px;
    }
    .live-badge.visible { display: block; }

    #play-btn {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%); z-index: 10;
      background: rgba(245,158,11,0.15); border: 1px solid #f59e0b;
      color: #f59e0b; font-family: 'Share Tech Mono', monospace;
      font-size: 14px; padding: 12px 24px; border-radius: 3px;
      cursor: pointer; letter-spacing: 0.1em;
    }

    /* Settings panel */
    .settings-panel {
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .settings-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; cursor: pointer; user-select: none;
      border-bottom: 1px solid transparent; transition: border-color 0.2s;
    }
    .settings-header:hover { background: rgba(245,158,11,0.04); }
    .settings-panel.open .settings-header { border-bottom-color: var(--border); }
    .settings-toggle { color: var(--accent); font-size: 11px; width: 14px; }
    .settings-title {
      font-family: var(--sans); font-size: 12px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted);
    }
    .settings-body { display: none; padding: 14px; gap: 10px; flex-direction: column; }
    .settings-panel.open .settings-body { display: flex; }
    .settings-row { display: flex; flex-direction: column; gap: 4px; }
    .settings-label {
      font-family: var(--mono); font-size: 10px;
      color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase;
    }
    .settings-input {
      background: var(--bg); border: 1px solid var(--border-hi);
      border-radius: var(--radius); padding: 7px 10px;
      font-family: var(--mono); font-size: 12px; color: var(--text);
      outline: none; transition: border-color 0.15s;
    }
    .settings-input:focus { border-color: var(--accent); }
    .settings-actions { display: flex; gap: 8px; margin-top: 4px; }

    .btn-danger { border-color: #ef4444; color: #ef4444; }
    .btn-danger:hover:not(:disabled) { background: #ef4444; color: #fff; border-color: #ef4444; }
    .btn-success { border-color: var(--green); color: var(--green); }
    .btn-success:hover:not(:disabled) { background: var(--green); color: #000; border-color: var(--green); }
  </style>
</head>
<body>
  <div class="app">

    <header class="header">
      <svg class="header-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4zm16 2.5 4-2.5v12l-4-2.5V6.5z"/>
      </svg>
      <span class="header-title">Construction Cam</span>
      <span class="header-sub">VIEWER</span>
      <a href="index.html" class="home-link">← Home</a>
    </header>

    <main class="main">

      <!-- Status -->
      <div class="status-bar">
        <span id="status" class="status status--info">Initialising…</span>
        <span class="status-indicator"></span>
      </div>

      <!-- Video -->
      <div class="video-panel">
        <div class="video-label">LIVE FEED — <span id="videoSiteLabel">SITE-ALPHA</span></div>
        <span class="live-badge" id="liveBadge">● LIVE</span>
        <div class="corner-mark corner-mark--tl"></div>
        <div class="corner-mark corner-mark--tr"></div>
        <div class="corner-mark corner-mark--bl"></div>
        <div class="corner-mark corner-mark--br"></div>
        <div class="video-wrap">
          <div class="video-placeholder" id="placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
              <path d="M1 4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4zm16 2.5 4-2.5v12l-4-2.5V6.5z"/>
            </svg>
            Awaiting camera stream
          </div>
          <video id="remoteVideo" autoplay muted playsinline></video>
          <button id="play-btn" onclick="manualPlay()">▶ TAP TO PLAY</button>
          <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
      </div>

      <!-- Call Controls -->
      <div class="controls">
        <button class="btn btn-success" id="connectBtn" onclick="startViewer()">▶ Connect</button>
        <button class="btn btn-danger" id="disconnectBtn" style="display:none" onclick="stopViewer()">■ End Call</button>
      </div>

      <!-- Settings -->
      <div class="settings-panel" id="settingsPanel">
        <div class="settings-header" onclick="toggleSettings()">
          <span class="settings-toggle" id="settingsToggle">▶</span>
          <span class="settings-title">Settings</span>
        </div>
        <div class="settings-body">
          <div class="settings-row">
            <label class="settings-label">Sender Peer ID</label>
            <input class="settings-input" id="senderPeerIdInput" type="text" placeholder="construction-cam-sender-001" />
          </div>
          <div class="settings-row">
            <label class="settings-label">Site ID</label>
            <input class="settings-input" id="siteIdInput" type="text" placeholder="site-alpha" />
          </div>
          <div class="settings-actions">
            <button class="btn" onclick="applySettings()">Apply & Reconnect</button>
          </div>
        </div>
      </div>

      <!-- Info -->
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Camera ID</div>
          <div class="info-value" id="infoCameraId">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Site ID</div>
          <div class="info-value" id="infoSiteId">—</div>
        </div>
        <div class="info-item">
          <div class="info-label">Stream State</div>
          <div class="info-value" id="infoState">Offline</div>
        </div>
        <div class="info-item">
          <div class="info-label">Connected Since</div>
          <div class="info-value" id="infoConnectedAt">—</div>
        </div>
      </div>

    </main>
  </div>

  <script src="peerjs.min.js"></script>
  <script src="app.js"></script>
  <script src="ice.js"></script>
  <script src="debug.js"></script>
  <script src="diagnostics.js"></script>
  <script src="viewer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('senderPeerIdInput').value = CONFIG.SENDER_PEER_ID;
      document.getElementById('siteIdInput').value = CONFIG.SITE_ID;
      document.getElementById('infoCameraId').textContent = CONFIG.CAMERA_ID;
      document.getElementById('infoSiteId').textContent = CONFIG.SITE_ID;
      document.getElementById('videoSiteLabel').textContent = CONFIG.SITE_ID.toUpperCase();
    });

    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      const toggle = document.getElementById('settingsToggle');
      panel.classList.toggle('open');
      toggle.textContent = panel.classList.contains('open') ? '▼' : '▶';
    }

    function applySettings() {
      const peerId = document.getElementById('senderPeerIdInput').value.trim();
      const siteId = document.getElementById('siteIdInput').value.trim();
      if (peerId) CONFIG.SENDER_PEER_ID = peerId;
      if (siteId) {
        CONFIG.SITE_ID = siteId;
        document.getElementById('infoSiteId').textContent = siteId;
        document.getElementById('videoSiteLabel').textContent = siteId.toUpperCase();
      }
      toggleSettings();
      stopViewer();
      initPeer();
    }

    function toggleFullscreen() {
      const panel = document.querySelector('.video-panel');
      if (!document.fullscreenElement) panel.requestFullscreen().catch(console.error);
      else document.exitFullscreen();
    }

    function manualPlay() {
      const video = document.getElementById('remoteVideo');
      const btn = document.getElementById('play-btn');
      video.play().then(() => { if (btn) btn.style.display = 'none'; })
        .catch(e => console.error('Manual play failed:', e));
    }
  </script>
</body>
</html>
