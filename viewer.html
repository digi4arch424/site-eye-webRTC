<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0c0e">
  <title>Construction Cam — Viewer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Viewer-specific: fullscreen button */
    .fullscreen-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--border-hi);
      color: var(--text);
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-family: var(--mono);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .video-wrap:hover .fullscreen-btn { opacity: 1; }

    /* Live badge */
    .live-badge {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 4;
      background: var(--red);
      color: #fff;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 2px;
    }
    .live-badge.visible { display: block; }
  </style>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <svg class="header-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4zm16 2.5 4-2.5v12l-4-2.5V6.5z"/>
      </svg>
      <span class="header-title">Construction Cam</span>
      <span class="header-sub">VIEWER / <span id="cameraIdDisplay">site-cam-001</span></span>
    </header>

    <main class="main">

      <!-- Server Config -->
      <div class="config-section">
        <div class="config-title">Signaling Server</div>
        <div class="config-row">
          <input
            type="text"
            id="serverUrlInput"
            class="config-input"
            placeholder="ws://YOUR_VPS_IP:8080"
          />
          <button class="btn" onclick="applyServerUrl()">Connect</button>
        </div>
      </div>

      <!-- Status -->
      <div class="status-bar">
        <span id="status" class="status status--info">Initialising…</span>
        <span class="status-indicator"></span>
      </div>

      <!-- Video -->
      <div class="video-panel">
        <div class="video-label">LIVE FEED — <span id="videoSiteLabel">SITE-ALPHA</span></div>
        <span class="live-badge" id="liveBadge">● LIVE</span>
        <div class="corner-mark corner-mark--tl"></div>
        <div class="corner-mark corner-mark--tr"></div>
        <div class="corner-mark corner-mark--bl"></div>
        <div class="corner-mark corner-mark--br"></div>
        <div class="video-wrap">
          <div class="video-placeholder" id="placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
              <path d="M1 4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4zm16 2.5 4-2.5v12l-4-2.5V6.5z"/>
            </svg>
            Awaiting camera stream
          </div>
          <video id="remoteVideo" autoplay playsinline></video>
          <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
      </div>

      <!-- Info -->
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Camera ID</div>
          <div class="info-value" id="infoCameraId">site-cam-001</div>
        </div>
        <div class="info-item">
          <div class="info-label">Site ID</div>
          <div class="info-value" id="infoSiteId">site-alpha</div>
        </div>
        <div class="info-item">
          <div class="info-label">Stream State</div>
          <div class="info-value" id="infoState">Offline</div>
        </div>
        <div class="info-item">
          <div class="info-label">Connected Since</div>
          <div class="info-value" id="infoConnectedAt">—</div>
        </div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
  <script src="viewer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('serverUrlInput').value = CONFIG.SIGNALING_SERVER_URL;
      document.getElementById('cameraIdDisplay').textContent = CONFIG.CAMERA_ID;
      document.getElementById('infoCameraId').textContent = CONFIG.CAMERA_ID;
      document.getElementById('infoSiteId').textContent = CONFIG.SITE_ID;
      document.getElementById('videoSiteLabel').textContent = CONFIG.SITE_ID.toUpperCase();
    });

    function applyServerUrl() {
      const url = document.getElementById('serverUrlInput').value.trim();
      if (url) {
        CONFIG.SIGNALING_SERVER_URL = url;
        connectSignaling();
      }
    }

    function toggleFullscreen() {
      const panel = document.querySelector('.video-panel');
      if (!document.fullscreenElement) {
        panel.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen();
      }
    }

    // Show live badge when streaming
    const origObserver = new MutationObserver(() => {
      const video = document.getElementById('remoteVideo');
      const badge = document.getElementById('liveBadge');
      const stateEl = document.getElementById('infoState');
      const connEl = document.getElementById('infoConnectedAt');
      if (video.classList.contains('active')) {
        badge.classList.add('visible');
        stateEl.textContent = 'Live';
        if (connEl.textContent === '—') {
          connEl.textContent = new Date().toLocaleTimeString();
        }
      } else {
        badge.classList.remove('visible');
        stateEl.textContent = 'Offline';
      }
    });
    origObserver.observe(document.getElementById('remoteVideo'), { attributes: true });
  </script>
</body>
</html>
